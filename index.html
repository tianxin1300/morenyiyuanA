<style>
:root{--bg:#f2f6f6;--card:#fff;--ink:#16282c;--mute:#5d7075;--line:#d5e0e1;--c:#0f766e;--r:12px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a1c;--card:#182427;--ink:#e6f0f1;--mute:#93a8ac;--line:#2b3c40}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 18px 140px}
h1{font-size:22px;margin:8px 0 2px}h2{font-size:17px;margin:0 0 10px}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;max-width:100%}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--c);background:var(--c);color:#fff}
.chip.add{border-style:dashed;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:18px}
.card.hd{border-left:5px solid var(--c)}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--c);outline-offset:1px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:6px;margin:0;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;background:var(--bg)}
.checks input{width:auto}
.item{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--bg)}
.item .row{margin-bottom:6px}.item input,.item select{background:var(--card)}
button.btn{font:inherit;border:0;border-radius:8px;padding:9px 16px;background:var(--c);color:#fff;cursor:pointer}
button.ghost{font:inherit;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
button.del{color:#E05252;border-color:#E05252}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--r);padding:12px 14px;font:inherit;cursor:pointer;border-left:6px solid var(--c)}
.opt small{display:block;color:var(--mute)}
.opt[aria-pressed=true]{background:var(--bg);border-color:var(--c)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.saved{font-size:13px;color:var(--mute)}
 .empty{text-align:center;padding:36px 12px}
.today{background:#fff;border-color:#b8d8d1;box-shadow:0 8px 24px rgba(15,118,110,.12)}
.today .item{background:#f5fbf8;border-color:#c7e3dc}
.today h2{color:#0f5f59}
.action-note{font-size:13px;color:var(--mute);margin:8px 0 0}
.flow{border:1.5px solid #8ccfc0;background:#f7fcfa!important}
.flow .flow-step{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #d7ebe5}
.flow .flow-step:last-child{border-bottom:0}
.flow .flow-num{flex:none;width:28px;height:28px;border-radius:50%;background:#d8eee8;color:#0f5f59;display:grid;place-items:center;font-weight:700}
.flow .flow-main{flex:1;min-width:0}.flow .flow-main b{display:block}.flow .flow-main small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.flow .flow-done .flow-num{background:#13615c;color:#fff}.flow .flow-done b{color:#0f5f59}
.toast[role="status"]{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;border-radius:999px;padding:10px 18px;z-index:10;display:flex;gap:12px;align-items:center}.toast[role="status"] button{background:none;border:0;color:#7fd3ff;font:inherit;font-weight:700;cursor:pointer;min-height:36px}
.pvdoc{display:none}body.pvmode{background:#fff}body.pvmode main{display:none}
body.pvmode .pvdoc{display:block;background:#fff;color:#111;padding:16px;max-width:720px;margin:0 auto}
.pvdoc .sm{font-size:17px}.pvdoc .sm h3{color:#0f5132}.pvimg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pvimg img{width:100%;border:1px solid #ccc;break-inside:avoid}
@media print{.noprint{display:none!important}.pvdoc{padding:0}}
.tab{padding:0 2px;font-size:16px}
.sm{font-size:19px;line-height:1.75}.sm h3{font-size:19px;margin:16px 0 4px;color:var(--c)}.sm ul{margin:0;padding-left:22px}.sm li{margin-bottom:4px}
.acct{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.ov{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.mod{background:var(--card);color:var(--ink);border-radius:var(--r);padding:18px;max-width:420px;width:100%}.mod textarea{min-height:200px}
.warn{color:#b42318;font-size:15px}.lockb{width:100%;margin:6px 0 10px}
@media print{.chips,.tabs,.acct,button,.seg{display:none}}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.tab{font:inherit;font-weight:600;min-height:52px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--r);cursor:pointer}
.tab[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
.seg{display:flex;gap:8px;margin-bottom:12px}.seg .chip{flex:1;min-height:48px}
input,select,textarea{min-height:48px;font-size:17px}
input[type=checkbox],input[type=radio]{min-height:0;width:20px;height:20px}
button.btn,button.ghost{min-height:48px}.chip{min-height:44px}
.tlh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.tag{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:14px}
.tlt{white-space:pre-wrap;margin:6px 0 10px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.thumbs img{width:88px;height:88px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:var(--bg)}
.val{font-size:26px;font-weight:700}.val small{font-size:14px;font-weight:400;color:var(--mute)}
.bad{color:#dc2626}.ch{width:100%;height:auto;color:var(--mute);margin:6px 0 10px}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px}
details{margin-top:12px}summary{cursor:pointer;min-height:44px;line-height:44px}
.foot{font-size:14px;color:var(--mute)}.emg{border:1.5px solid #dc2626;border-radius:8px;padding:10px 14px;color:var(--ink)}.emg ul{margin:6px 0 0;padding-left:20px}

.gt{font-size:15px;color:var(--mute);font-weight:600;margin:22px 0 10px;letter-spacing:.04em}
.hub{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:18px}
.hub .opt{padding:14px;border-left-width:1.5px}
.hb{margin-top:14px}.hb .btn,.hb .ghost{padding:12px 14px}
.pos p{margin:6px 0 0;font-size:15px;color:var(--mute)}
details.card>summary{cursor:pointer;font-weight:600}details.card[open]>summary{margin-bottom:8px}
details.card p{font-size:15px;color:var(--mute);margin:6px 0}
.ckr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ckr label{flex:1;margin:0;color:var(--ink);font-size:16px;display:flex;gap:10px;align-items:center;cursor:pointer}.ckr input{width:20px;height:20px;flex:none}
.ckr.done label span{text-decoration:line-through;color:var(--mute)}
@media (min-width:768px){main{max-width:860px}.hub{grid-template-columns:repeat(3,minmax(0,1fr))}.opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
:root.big body{font-size:20px;line-height:1.65}
:root.big h1{font-size:28px}:root.big h2{font-size:21px}
:root.big .sub,:root.big .pos p,:root.big details.card p{font-size:17px}
:root.big label{font-size:17px}
:root.big input,:root.big select,:root.big textarea{font-size:19px;padding:11px 12px}
:root.big button.btn,:root.big button.ghost{font-size:18px;padding:12px 18px;min-height:46px}
:root.big .opt small{font-size:16px}:root.big .chip{font-size:17px}
:root.big .ckr label{font-size:19px}:root.big .ckr input{width:24px;height:24px}
:root.big .tab{font-size:16px}
.ia ol{padding-left:1.4em;margin:8px 0;display:flex;flex-direction:column;gap:8px;font-size:19px}
.ia input{font-size:15px}
.item .row{flex-wrap:wrap}.item .row>*{flex:1 1 42%}

/* 导航重排：吸顶、大字、单一高亮 */
.pnav{position:sticky;top:0;z-index:5;margin:0 -18px 18px;padding:10px 18px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 6px 14px -12px rgba(0,0,0,.35)}
.phd{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-width:0}
.back{flex:none;font:inherit;font-size:17px;font-weight:600;color:var(--c);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;min-height:44px;cursor:pointer}
.pname{flex:1;min-width:0;font-size:18px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;padding:6px 2px;font:inherit;font-size:17px;font-weight:600;line-height:1.2;color:var(--mute);background:transparent;border:0;border-radius:12px;cursor:pointer;transition:background .15s,color .15s}
.tab .ti{font-size:22px;line-height:1}
.tab[aria-pressed=true]{background:var(--c);color:#fff;box-shadow:0 3px 8px -3px rgba(0,0,0,.35)}
.tab[aria-pressed=false]:active{background:var(--bg)}
:root.big .tab{font-size:19px;min-height:72px}:root.big .tab .ti{font-size:24px}
:root.big .pname{font-size:21px}:root.big .back{font-size:19px}
@media (max-width:360px){.tab{font-size:15px}}
@media print{.pnav{display:none}}

/* 收纳：减少文字、统一网格 */
h1{display:flex;align-items:center;gap:6px;font-size:22px;margin:4px 0 12px}
.note{font-size:14px;color:var(--mute);margin:-4px 0 14px}
.tip{padding:12px 16px}.tip summary{font-weight:600;cursor:pointer}
.qk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.qk button{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:76px;font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;cursor:pointer}
.qk button span{font-size:24px;line-height:1.2;margin-top:8px}
.qk button[aria-pressed=true]{border-color:var(--c);color:var(--c)}
.foot2{margin:24px 0 0;padding:12px 0;border-top:1px solid var(--line);font-size:15px;color:var(--mute)}
.foot2 summary{cursor:pointer}.foot2 p{font-size:15px}
.acct{font-size:15px;color:var(--mute)}
.opts .opt{padding:14px 16px}
:root.big .qk button{font-size:18px}:root.big .note,:root.big .foot2{font-size:17px}

/* ===== 视觉：森林·溪流 ===== */
:root{--c:#13615c;--ink:#10241f;--mute:#4f6660;--line:rgba(16,52,44,.12);--card:rgba(255,255,255,.86);--bg:rgba(240,246,242,.9);--r:18px;--leaf:#8bc34a}
html{background:#0d2a22}
body{background:transparent;color:var(--ink)}

body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,28,22,.15) 0,rgba(6,28,22,.35) 180px,rgba(8,30,26,.62) 420px,rgba(8,30,26,.72) 100%)}
main{padding-top:calc(28px + env(safe-area-inset-top,0px))}
h1{color:#fff;font-size:30px;font-weight:700;letter-spacing:.06em;margin:8px 0 6px;text-shadow:0 2px 12px rgba(0,0,0,.35)}
h1 small{color:rgba(255,255,255,.8)!important}
.note{color:rgba(255,255,255,.88);font-size:14px;margin:0 0 22px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.gt{color:rgba(255,255,255,.92);font-size:16px;letter-spacing:.12em;margin:26px 2px 12px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.acct{color:rgba(255,255,255,.85)}.acct b{color:#fff}
.acct .ghost{color:#fff;border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card,.opt,.qk button,.tabs,.tip{background:var(--card);border:1px solid rgba(255,255,255,.55);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);box-shadow:0 10px 30px -14px rgba(0,20,14,.55)}
.card{border-radius:var(--r)}
.card.hd{border-left:1px solid rgba(255,255,255,.55);box-shadow:inset 4px 0 0 var(--c),0 10px 30px -14px rgba(0,20,14,.55)}
.opt{border-radius:var(--r);border-left:1px solid rgba(255,255,255,.55);box-shadow:inset 5px 0 0 var(--c),0 10px 30px -14px rgba(0,20,14,.55);padding:16px 18px}
.opt b{font-size:18px}
.tip summary{color:var(--ink)}
input,select,textarea{background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:12px}
button.btn{background:linear-gradient(135deg,#1c7a6f,#0f4f48);border-radius:14px;font-weight:600;box-shadow:0 8px 18px -8px rgba(15,79,72,.7);min-height:48px}
button.ghost{border-radius:14px;background:rgba(255,255,255,.7);min-height:44px}
.hb .ghost{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.qk button{border-radius:20px;color:var(--ink)}
.qk button[aria-pressed=true]{color:var(--c);box-shadow:inset 0 0 0 2px var(--c)}
